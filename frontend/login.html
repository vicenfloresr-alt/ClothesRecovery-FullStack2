<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothes Recovery</title>

    <link rel="stylesheet" href="css/estilos.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header class="site-header">
        <div class="header-top">
            <a href="index.html" class="logo">
                <img src="img/=clohtes.jpg" alt="Logo Clothes Recovery">
            </a>
            <nav class="main.nav" aria-label="Navegacion principal">
                <ul>
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="blogs.html">Blogs</a></li>
                    <li><a href="contacto.html">Contactos</a></li>
                </ul>
            </nav>

            </a>
        </div>
        <div class="header-auth">
            <a href="login.html">Inciar Sesion</a>
            <span>|</span>
            <a href="registro.html">Registrarse</a>
        </div>
    </header>
    <main>
        <section class="container py-5">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="form-contenedor">
                        <h1>Inicia sesión</h1>
                        <p class="form-subtitulo">Ingresa a tu cuenta para seguir comprando.</p>

                        <form id="form-login" novalidate>

                            <div class="form-grupo mb-3">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" id="correo" name="correo" class="form-control" autocomplete="email"
                                    maxlength="100" required>
                                <span class="mensaje-error" id="error-correo"></span>
                            </div>

                            <div class="form-grupo mb-3">
                                <label for="contrasena" class="form-label">Contraseña</label>
                                <input type="password" id="contrasena" name="contrasena" class="form-control"
                                    autocomplete="current-password" required>
                                <span class="pista">Entre 4 y 10 caracteres</span>
                                <span class="mensaje-error" id="error-contrasena"></span>
                            </div>

                            <button type="submit" class="btn btn-primario w-100 mt-2">Iniciar sesión</button>

                            <p class="text-center mt-3">
                                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
                            </p>

                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer py-5 mt-4">
        <div class="container">
            <div class="row g-4">
                <div class="col-md-4">
                    <p class="logo">ClothesRecovery</p>
                    <p>&copy; 2026 Todos los derechos reservados.</p>
                </div>
                <div class="col-md-4">
                    <h4>Categorías</h4>


                </div>
                <div class="col-md-4">
                    <h4>Mantente al tanto</h4>
                    <form class="input-group">
                        <label for="newsletter-email" class="sr-only">Correo electrónico</label>
                        <input type="email" id="newsletter-email" class="form-control" placeholder="Ingresa tu correo">
                        <button type="submit" class="btn btn-secundario">Suscribirme</button>
                    </form>
                </div>
            </div>
        </div>
    </footer>


    <script>
        function validarCorreo(valor) {
            const patron = /^[^\s@]+@(duoc\.cl|profesor\.duoc\.cl|gmail\.com)$/i;
            return patron.test(valor.trim());
        }

        const inputCorreo = document.getElementById('correo');
        const errorCorreo = document.getElementById('error-correo');

        const inputContrasena = document.getElementById('contrasena');
        const errorContrasena = document.getElementById('error-contrasena');

        function validarCampoCorreo() {
            const valor = inputCorreo.value.trim();
            let mensaje = '';

            if (valor === '') {
                mensaje = 'El correo es obligatorio.';
            } else if (!validarCorreo(valor)) {
                mensaje = 'Usa un correo @duoc.cl, @profesor.duoc.cl o @gmail.com.';
            }

            errorCorreo.textContent = mensaje;
            if (mensaje !== '') {
                inputCorreo.classList.add('campo-invalido');
            } else {
                inputCorreo.classList.remove('campo-invalido');
            }
            return mensaje === '';
        }

        function validarCampoContrasena() {
            const valor = inputContrasena.value;
            let mensaje = '';

            if (valor === '') {
                mensaje = 'La contraseña es obligatoria.';
            } else if (valor.length < 4 || valor.length > 10) {
                mensaje = 'Debe tener entre 4 y 10 caracteres.';
            }

            errorContrasena.textContent = mensaje;
            if (mensaje !== '') {
                inputContrasena.classList.add('campo-invalido');
            } else {
                inputContrasena.classList.remove('campo-invalido');
            }
            return mensaje === '';
        }

        inputCorreo.addEventListener('input', validarCampoCorreo);
        inputContrasena.addEventListener('input', validarCampoContrasena);

        function buscarUsuario(correo, contrasena) {
            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            for (let i = 0; i < usuarios.length; i++) {
                if (usuarios[i].correo.toLowerCase() === correo.toLowerCase() && usuarios[i].contrasena === contrasena) {
                    return usuarios[i];
                }
            }
            return null;
        }

        document.getElementById('form-login').addEventListener('submit', function (evento) {
            evento.preventDefault();

            const correoValido = validarCampoCorreo();
            const contrasenaValida = validarCampoContrasena();

            if (!correoValido || !contrasenaValida) {
                return;
            }

            const correoIngresado = inputCorreo.value.trim();
            const contrasenaIngresada = inputContrasena.value;
            const usuarioEncontrado = buscarUsuario(correoIngresado, contrasenaIngresada);

            if (!usuarioEncontrado) {
                errorContrasena.textContent = 'Correo o contraseña incorrectos.';
                return;
            }

            localStorage.setItem('usuarioActivo', JSON.stringify(usuarioEncontrado));
            alert('¡Bienvenido/a de nuevo, ' + usuarioEncontrado.nombre + '!');
            window.location.href = 'index.html';
        });


    </script>
</body>
