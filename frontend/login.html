        </div>

    <script>
        function validarCorreo(valor) {
            const patron = /^[^\s@]+@(duoc\.cl|profesor\.duoc\.cl|gmail\.com)$/i;
            return patron.test(valor.trim());
        }

        const inputCorreo = document.getElementById('correo');
        const errorCorreo = document.getElementById('error-correo');

        const inputContrasena = document.getElementById('contrasena');
        const errorContrasena = document.getElementById('error-contrasena');

        function validarCampoCorreo() {
            const valor = inputCorreo.value.trim();
            let mensaje = '';

            if (valor === '') {
                mensaje = 'El correo es obligatorio.';
            } else if (!validarCorreo(valor)) {
                mensaje = 'Usa un correo @duoc.cl, @profesor.duoc.cl o @gmail.com.';
            }

            errorCorreo.textContent = mensaje;
            if (mensaje !== '') {
                inputCorreo.classList.add('campo-invalido');
            } else {
                inputCorreo.classList.remove('campo-invalido');
            }
            return mensaje === '';
        }

        function validarCampoContrasena() {
            const valor = inputContrasena.value;
            let mensaje = '';

            if (valor === '') {
                mensaje = 'La contraseña es obligatoria.';
            } else if (valor.length < 4 || valor.length > 10) {
                mensaje = 'Debe tener entre 4 y 10 caracteres.';
            }

            errorContrasena.textContent = mensaje;
            if (mensaje !== '') {
                inputContrasena.classList.add('campo-invalido');
            } else {
                inputContrasena.classList.remove('campo-invalido');
            }
            return mensaje === '';
        }

        inputCorreo.addEventListener('input', validarCampoCorreo);
        inputContrasena.addEventListener('input', validarCampoContrasena);

        function buscarUsuario(correo, contrasena) {
            const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];
            for (let i = 0; i < usuarios.length; i++) {
                if (usuarios[i].correo.toLowerCase() === correo.toLowerCase() && usuarios[i].contrasena === contrasena) {
                    return usuarios[i];
                }
            }
            return null;
        }

        document.getElementById('form-login').addEventListener('submit', function (evento) {
            evento.preventDefault();

            const correoValido = validarCampoCorreo();
            const contrasenaValida = validarCampoContrasena();

            if (!correoValido || !contrasenaValida) {
                return;
            }

            const correoIngresado = inputCorreo.value.trim();
            const contrasenaIngresada = inputContrasena.value;
            const usuarioEncontrado = buscarUsuario(correoIngresado, contrasenaIngresada);

            if (!usuarioEncontrado) {
                errorContrasena.textContent = 'Correo o contraseña incorrectos.';
                return;
            }

            localStorage.setItem('usuarioActivo', JSON.stringify(usuarioEncontrado));
            alert('¡Bienvenido/a de nuevo, ' + usuarioEncontrado.nombre + '!');
            window.location.href = 'index.html';
        });


    </script>
</body>
