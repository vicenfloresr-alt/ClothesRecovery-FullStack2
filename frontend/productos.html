<html lang="es">

<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="css/estilos.css">


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Cinzel:wght@500;700&family=Inter:wght@400;500&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>


  <header class="site-header">
    <div class="header-top">
      <a href="index.html" class="logo">Clothes<span>Recovery</span></a>

      <nav class="main-nav" aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="productos.html" class="active">Productos</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="blogs.html">Blogs</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>

    </div>

    <div class="header-auth">
      <a href="login.html">Iniciar sesión</a>
      <span>|</span>
      <a href="registro.html">Registrar usuario</a>
    </div>
  </header>



  <main>
    <section class="pagina-productos">
      <h1>Productos</h1>

      <div id="contenedor-productos" class="grid-productos">
        
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-col">
      <p class="logo">Clothes Recovery</p>
      <p>&copy; 2026 todos los derechos reservados.</p>
    </div>
    <div class="footer-col">
      <h4>Mantente al tanto</h4>
      <form class="form-newsletter">
        <label for="newsletter-email" class="sr-only">Correo electronico</label>
        <input type="email" id="newsletter-email" placeholder="Ingresa tu correo">
        <button type="submit" class="btn btn-secundario">Suscribirme</button>
      </form>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


  <script>
    const productos = [
      { codigo: 'POL-001', nombre: 'POLO 001 ARCHIVE — FUR EDITION', descripcion: 'Algodón pesado, corte oversize.', precio: 35990, categoria: 'Poleras', imagen: 'img/polera1.jpg' },
      { codigo: 'POL-002', nombre: 'Polera Gráfica Blackletter', descripcion: 'Estampado con tipografía gótica.', precio: 29990, categoria: 'Poleras', imagen: 'img/poleras2.jpg' },
      { codigo: 'POL-003', nombre: 'Polera Manga Larga Ribbed', descripcion: 'Tejido acanalado, cuello alto.', precio: 20000, categoria: 'Poleras', imagen: 'img/polera3.jpg' },
      { codigo: 'POL-004', nombre: 'Polera Crop Denim', descripcion: 'Corte crop, mezcla denim.', precio: 15990, categoria: 'Poleras', imagen: 'img/polera6.jpg' },

      { codigo: 'PAN-001', nombre: 'Jeans Slim Gótico', descripcion: 'Slim fit, negro desgastado.', precio: 30990, categoria: 'Pantalones', imagen: 'img/pantalon1.webp' },
      { codigo: 'PAN-002', nombre: 'Cargo Pants Negro', descripcion: 'Bolsillos laterales, cintura ajustable.', precio: 25990, categoria: 'Pantalones', imagen: 'img/cargo1.webp' },
      { codigo: 'PAN-004', nombre: 'Jeans Estampado Tattoo', descripcion: 'Estampado gráfico estilo tattoo old school.', precio: 49990, categoria: 'Pantalones', imagen: 'img/edhardys.webp' },

      { codigo: 'CHA-001', nombre: 'Chaqueta Denim Negra', descripcion: 'Denim rígido teñido negro.', precio: 35990, categoria: 'Chaquetas', imagen: 'img/chaqueta1.jpg' },
      { codigo: 'CHA-002', nombre: 'Chaqueta Bomber Oversize', descripcion: 'Forro acolchado, corte oversize.', precio: 32000, categoria: 'Chaquetas', imagen: 'img/chaqueta2.jpg' },

      { codigo: 'CAL-001', nombre: 'Nike Shox TL', descripcion: 'Suela de goma, 8 hoyos.', precio: 150000, categoria: 'Calzado', imagen: 'img/calzado1.webp' },
      { codigo: 'CAL-002', nombre: 'Jordan 4 Black Cat', descripcion: 'Plataforma 4cm, cordones anchos.', precio: 200000, categoria: 'Calzado', imagen: 'img/calzado2.jpg' }

    ];

    function formatearPrecio(numero) {
      return '$' + numero.toLocaleString('es-CL');


    }


    function crearTarjetaProducto(producto) {
      return `
        <article class="tarjeta-producto">
          <a href="detalle-producto.html?codigo=${producto.codigo}" class="tarjeta-producto-link">
            <img src="${producto.imagen}" alt="${producto.nombre}">
            <h3>${producto.nombre}</h3>
            <p class="precio">${formatearPrecio(producto.precio)}</p>
          </a>
          <button class="btn btn-primario btn-agregar" data-codigo="${producto.codigo}">Añadir al carrito</button>
        </article>
      `;


    }

    document.getElementById('contenedor-productos').innerHTML = productos.map(crearTarjetaProducto).join('');



    let html = '';
    for (let i = 0; i < productos.length; i++) {
      html = html + crearTarjetaProducto(productos[i]);
    }
    document.getElementById('contenedor-productos').innerHTML = html;
  </script>

</body>
